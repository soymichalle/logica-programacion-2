<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="bga-14">

        <!-- FONDO ANIMADO -->
        <div class="bga-14__mesh" aria-hidden="true"></div>
        <div class="bga-14__grain" aria-hidden="true"></div>

        <section class="bga-14__stage">

            <div class="converted-card text-center p-4">

                <!-- TITULO -->
                <h1 class="mb-4">Conversor de Temperatura</h1>
                <p class="fst-italic">Por: Michalle Muñoz</p>

            </div>

            <form id="formConversor" class="p-4">

                <div class="align-items-center">

                    <div class="row align-items-center g-3 mb-4">

                        <div class="col-12 col-md-5">
                            <label class="form-label p-2" for="inpCelsius">Temperatura en Celsius: </label>
                        </div>

                        <div class="col-12 col-md-5">
                            <input class="form-control col-3" type="number" name="inpCelsius" id="inpCelsius"
                                placeholder="Ej. 10">
                        </div>

                        <div class="col-12 col-md-2">
                            <p class="mb-0">°C</p>
                        </div>

                    </div>

                    <!-- BOTON -->
                    <div class="mb-4">
                        <button id="btnConvertir" type="button" class="btn w-100 mb-4">Convertir</button>
                    </div>

                    <!-- RESULTADOS -->
                    <h2 class="text-center mb-4">Valores convertidos</h2>

                    <div class="row g-4">

                        <div class="col-12 col-md-6">
                            <div class="row align-items-center g-2">

                                <div class="col-12">
                                    <label for="inpFar">Temperatura en Fahrenheit:</label>
                                </div>

                                <div class="col-10">
                                    <input class="form-control" type="text" name="inpFar" id="inpFar" readonly
                                        placeholder="50">
                                </div>

                                <div class="col-2">
                                    <p class="mb-0">°F</p>
                                </div>

                            </div>
                        </div>

                        <div class="col-12 col-md-6">
                            <div class="row align-items-center g-2">

                                <div class="col-12">
                                    <label for="inpKelvin">Temperatura en Kelvin:</label>
                                </div>

                                <div class="col-10">
                                    <input class="form-control" type="text" name="inpKelvin" id="inpKelvin" readonly
                                        placeholder="283,15">
                                </div>
                                
                                <div class="col-2">
                                    <p class="mb-0">K</p>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <script src="app.js"></script>
</body>

</html>
