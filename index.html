<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main>
        <form>
            <div class="container align-items-center">
                <label class="col-6" for="inpCelsius">Temperatura en Celsius: </label>
                <input class="form-control col-3" type="text" name="inpCelsius" id="inpCelsius" placeholder="Ej. 10">
                <p class="col-3">°C</p>
            </div>

            <button id="btnConvertir" type="button" class="btn btn-primary">Convertir</button>

            <h2 class="col-12 text-center">Valores convertidos</h2>

            <div class="row g-3 align-items-center">
                <div class="container col-6 p-2">
                    <label class="col-12" for="inpFar">Temperatura en Fahrenheit:</label>
                    <input class="form-control" type="text" name="inpFar" id="inpFar" disabled placeholder="50">
                    <p>°F</p>
                </div>

                <div class="container col-6 p-2">
                    <label class="col-12" for="inpKelvin">Temperatura en Kelvin:</label>
                    <input class="form-control" type="text" name="inpKelvin" id="inpKelvin" disabled placeholder="283,15">
                    <p>K</p>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

        <script src="app.js"></script>
</body>

</html>
